query:
  history_turns: 4    # utterances, i.e. two user/agent rounds
  short_words: 7      # gated: add history only to utterances this short (picked on train, scripts/select_gate.py)
  max_words: 96       # ~p85 of 4-utterance queries; keeps dense query encoding under ~128 tokens
retrieval:
  bm25_k: 20
  dense_model: BAAI/bge-m3
  dense_k: 20
  rrf_k: 60
  top_n: 5
route:
  enabled: true
  text: dialogue      # router reads the whole dialogue so far; picked on held-out train dialogues
  threshold: {first_turn: 0.9, follow_up: 0.7}   # picked on held-out train dialogues (scripts/train_router.py)
rerank:
  model: BAAI/bge-reranker-v2-m3
  enabled: true
  candidates: 40      # whole RRF list (bm25_k + dense_k, deduplicated); same gated query as retrieval
harness:
  # per-stage budgets, about 1.3-2x the p95 latency on 50 MultiDoc2Dial turns and eCFR dev (scripts/check_dag.py);
  # on timeout: route -> search all domains, retrieve -> BM25 only, rerank -> keep the RRF order
  timeouts_ms: {route: 150, retrieve: 300, rerank: 1500}
verifier:
  enabled: false
