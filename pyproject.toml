[project]
name = "vpqa"
version = "0.0.1"
description = "Grounded, version-aware QA over multi-department policy documents"
requires-python = ">=3.10"
dependencies = [
  "rank-bm25>=0.2.2",
  "sentence-transformers>=3.0",
  "numpy>=1.26",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "datasets>=2.19",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
